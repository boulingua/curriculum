# In-scope scales carrying no statements, and why.
#
# This file exists because of what an empty cell MEANS. The descriptor-existence
# matrix is what excuses a course from covering a (level, scale) cell — if the
# framework has no descriptor, no course can be expected to realize one. So an
# in-scope scale with zero statements silently excuses all eighteen courses from
# ever teaching that thing, and it does so whether the emptiness is real or an
# authoring omission.
#
# Two states, and the difference is the whole point:
#
#   status: empty-in-cv    The Companion Volume genuinely has no descriptor
#                          here. Requires a `cite` naming the CV section
#                          checked. Excused, and correctly so.
#
#   status: pending        Nobody has checked yet. NOT excused on the evidence
#                          — excused only because there is nothing to cover.
#                          self-audit warns on every run until it is resolved.
#
# A `pending` row is a debt, not a decision, and it is recorded here rather than
# left as an absence precisely so it cannot pass for one.

scales:
  - domain: PROD
    scale: addressing-audiences
    status: pending
    found: >-
      Zero statements at all seven levels. This is one of exactly two in-scope
      scales in that state out of 79, which is itself the reason to doubt it:
      its sibling production scales are populated throughout, and a whole
      CV scale being empty at every level is unusual.
    resolve: >-
      Check CEFR CV (2020), Production › Addressing Audiences. If descriptors
      exist, mint them additively — ids never renumber — and delete this row.
      If the CV genuinely has none, change status to empty-in-cv and add the
      page citation.
  - domain: INT
    scale: co-operating
    status: pending
    found: >-
      Zero statements at all seven levels, while the sibling interaction
      strategies INT.turntaking (A2-C1) and INT.asking-for-clarification
      (A1-C1) are populated. An omission is the more likely explanation.
    resolve: >-
      Check CEFR CV (2020), Interaction › Co-operating. Same procedure as
      above. Until then no course can realize this scale, so every course is
      excused from it by default — which is exactly the outcome this file
      exists to make visible.
